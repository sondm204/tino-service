services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "8080"
    ports:
      - "127.0.0.1:4000:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
