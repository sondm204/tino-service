name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt a deployment that has already started.
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate production Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Dockerfile installs the locked dependencies and runs pnpm build (tsc).
      - name: Build production image
        run: docker build --tag tino-service:ci .

  deploy:
    name: Deploy to Ubuntu VPS
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy this commit locally on the VPS
        run: |
          set -euo pipefail
          trap 'echo "::error::Deployment failed at script line $LINENO (exit $?)."' ERR
          release="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          root=/home/sondm204/projects/Tino/tino-service
          echo "Checking deployment prerequisites as $(id -un) on $(hostname)"
          if [[ ! -s "$root/.env.production" || ! -r "$root/.env.production" ]]; then
            echo "::error::Missing, empty, or unreadable $root/.env.production. Create it on the VPS and grant the runner service user read access."
            exit 1
          fi
          if [[ ! -w "$root" || ! -x "$root" ]]; then
            echo "::error::Runner service user needs write and traversal access to $root."
            exit 1
          fi
          if ! docker info >/dev/null; then
            echo "::error::Docker is unavailable to the runner service user. Check the Docker daemon and user permissions."
            exit 1
          fi
          if ! docker network inspect tino-internal >/dev/null; then
            echo "::error::Required Docker network tino-internal is missing. Create it on the VPS with: docker network create tino-internal"
            exit 1
          fi
          docker compose version
          echo "Preparing release $release"
          mkdir -p "$root/releases/$release"
          git archive --format=tar HEAD | tar -xf - -C "$root/releases/$release"
          cd "$root/releases/$release"
          ln -s "$root/.env.production" .env.production
          # Keep a stable Compose project name across release directories.
          docker compose -p tino-service -f docker-compose.prod.yml config --quiet
          docker compose -p tino-service -f docker-compose.prod.yml build --pull
          docker compose -p tino-service -f docker-compose.prod.yml up \
            -d --no-build --wait --wait-timeout 120
          curl --fail --silent --show-error http://127.0.0.1:4000/health
          ln -sfn "$root/releases/$release" "$root/current"
